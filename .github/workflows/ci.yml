name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun ci
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run doctor
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run qa
